<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #1a1a1a; }
  h1 { font-size: 1.2rem; }
  #log { background: #fff; border: 1px solid #ddd; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
  .user { background: #dbeafe; margin-left: auto; }
  .bot { background: #f1f5f9; }
  .bot.not_found, .bot.refused { background: #fef3c7; border-left: 4px solid #d97706; }
  .bot.error { background: #fee2e2; border-left: 4px solid #dc2626; }
  .meta { font-size: .78rem; color: #555; margin-top: 6px; }
  .badge { font-weight: 600; color: #92400e; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 1rem; }
  button { padding: 10px 18px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>
<h1>SaaS Support Assistant</h1>
<div id="log" aria-live="polite"></div>
<form id="form">
  <input id="input" autocomplete="off" maxlength="1000" placeholder="Ask a product question…">
  <button id="send" type="submit">Send</button>
</form>
<script>
const logEl = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const history = [];            // {role, content}; server also caps this
const MAX_CLIENT_HISTORY = 12;

// All content is inserted via textContent (never innerHTML) so model/user text can't inject HTML.
function addMessage(cls, text, metaText, badgeText) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (badgeText || metaText) {
    const meta = document.createElement("div");
    meta.className = "meta";
    if (badgeText) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = badgeText + " ";
      meta.appendChild(b);
    }
    if (metaText) meta.appendChild(document.createTextNode(metaText));
    div.appendChild(meta);
  }
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) { addMessage("bot error", "Please enter a message before sending."); return; }

  addMessage("user", message);
  input.value = "";
  sendBtn.disabled = input.disabled = true;
  const loading = addMessage("bot", "Thinking…");

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, conversation: history.slice(-MAX_CLIENT_HISTORY) }),
      signal: ctrl.signal,
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    loading.remove();

    if (!res.ok) {
      addMessage("bot error", data.error?.message || `Request failed (HTTP ${res.status}).`);
    } else {
      const meta = [];
      if (data.sources?.length) meta.push("Sources: " + data.sources.join(", "));
      meta.push("confidence " + Number(data.confidence).toFixed(2));
      if (data.latency_ms != null) meta.push(data.latency_ms + " ms");
      let badge = "";
      if (data.status === "not_found") badge = "⚠ Not found in documentation.";
      if (data.status === "refused") badge = "⚠ Request declined.";
      addMessage("bot " + data.status, data.answer, meta.join(" · "), badge);
      history.push({ role: "user", content: message }, { role: "assistant", content: data.answer });
    }
  } catch (err) {
    loading.remove();
    addMessage("bot error", err.name === "AbortError"
      ? "The request timed out. Please try again."
      : "Could not reach the server. Check your connection and try again.");
  } finally {
    clearTimeout(timer);
    sendBtn.disabled = input.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
